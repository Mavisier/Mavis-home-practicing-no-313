name: Docker Compose verification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/compose-check.yml'
      - 'compose.yaml'
      - 'backend/**'
      - 'frontend/**'
      - 'data/**'
      - 'tools/smoke_compose.py'

permissions:
  contents: read

jobs:
  compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DEMO_ENV_FILE: .local/docker-verification.env
      DATABASE_URL: postgresql+psycopg://workflow:workflow@127.0.0.1:5433/workflow
      DATABASE_POOL_SIZE: '8'
      DEMO_REQUESTER_TOKEN: local-demo-requester-change-me
      DEMO_APPROVER_TOKEN: local-demo-reviewer-change-me
      LLM_PROVIDER: fixture
      EMBEDDING_PROVIDER: fixture
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Prepare synthetic-only environment
        run: |
          mkdir -p .local
          cp .env.example .env
          cp .env.example "$DEMO_ENV_FILE"
          sed -i 's/DATABASE_POOL_SIZE=1/DATABASE_POOL_SIZE=8/' "$DEMO_ENV_FILE"
          python -m pip install uv==0.8.8
          uv sync --locked --directory backend --group mcp
      - name: Build and start native PostgreSQL, FastAPI and Nginx
        run: |
          docker version
          docker compose version
          docker compose --env-file "$DEMO_ENV_FILE" config --quiet
          docker compose --env-file "$DEMO_ENV_FILE" up --build -d --wait --wait-timeout 180
      - name: Native database tests and fixture evaluation
        run: |
          backend/.venv/bin/python -m pytest backend/tests -q
          backend/.venv/bin/python evals/run.py
          backend/.venv/bin/python tools/smoke_compose.py
          backend/.venv/bin/ruff check backend tools evals examples --config backend/pyproject.toml
      - name: Container status
        if: always()
        run: |
          docker compose --env-file "$DEMO_ENV_FILE" ps -a
          docker compose --env-file "$DEMO_ENV_FILE" logs --tail 100
      - name: Save verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: compose-verification
          path: |
            .local/compose-verification.json
            evals/reports/latest.json
          if-no-files-found: warn
          retention-days: 7
      - name: Stop test containers
        if: always()
        run: docker compose --env-file "$DEMO_ENV_FILE" down
