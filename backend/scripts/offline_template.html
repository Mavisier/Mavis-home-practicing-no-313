<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; img-src 'self' file:; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>$title</title>
  <style>
    body { font:15px system-ui; background:#f4f5f7; color:#263744;
           margin:32px auto; max-width:1100px; padding:0 20px; }
    h1 { font-size:25px; }
    aside { background:#fff1d9; padding:14px; border-radius:8px; }
    table { width:100%; background:white; border-collapse:collapse; margin:20px 0; }
    th,td { padding:12px; text-align:left; border-bottom:1px solid #eee; }
    pre { white-space:pre-wrap; background:white; padding:20px; border-radius:8px; }
    section { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:14px; }
    figure { margin:0; background:white; padding:10px; border-radius:8px; }
    img { width:100%; height:220px; object-fit:contain; }
    figcaption { font-size:12px; color:#7d8b94; }
    a { color:#b36936; }
  </style>
</head>
<body>
  <h1>$title</h1>
  <aside>Herkese açık ilanın yerel test kopyası. Araç durumu doğrulanmadı;
         fotoğraflar hasar analiziyle değerlendirilmedi.</aside>
  <p>Kaynak: <a href="$source_url" rel="noreferrer">Orijinal ilan</a> · Yakalama: $captured_at</p>
  <table>$rows</table>
  <h2>İlan başlığı</h2><p>$advert_title</p>
  <h2>Satıcı açıklaması</h2><pre>$description</pre>
  <h2>İndirilen $photo_count fotoğraf</h2><section>$cards</section>
</body>
</html>
