[project]
name = "agentic-workflow-assistant"
version = "0.1.0"
description = "A small, auditable internal workflow assistant"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "sqlalchemy>=2.0,<2.1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "alembic>=1.14,<2",
  "pgvector>=0.4,<1",
  "httpx>=0.28,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "pyyaml>=6,<7", "beautifulsoup4>=4.13,<5", "pillow>=11,<14"]
mcp = ["mcp>=1.20,<2"]
audit = ["pip-audit>=2.9,<3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--basetemp=../.tmp/pytest"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["app", "scripts", "integration_env"]
